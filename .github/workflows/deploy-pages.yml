name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  # Auto-deploy after catalog / Slack map refreshes (bot pushes don't trigger `on: push`)
  workflow_run:
    workflows:
      - Refresh Confluence catalog
      - Refresh Slack user map
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build for GitHub Pages
        env:
          # Custom domain (public/CNAME): set Actions variable VITE_BASE_PATH=/
          # Default: project site at https://<user>.github.io/<repo>/
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
          SITE_ACCESS_PASSWORD: ${{ secrets.SITE_ACCESS_PASSWORD }}
          VITE_REMIND_TRACK_URL: ${{ vars.VITE_REMIND_TRACK_URL }}
          VITE_REMIND_API_KEY: ${{ secrets.VITE_REMIND_API_KEY }}
        run: |
          npm ci
          if [ -n "$SITE_ACCESS_PASSWORD" ]; then
            export VITE_ACCESS_PASSWORD_HASH=$(node -e "console.log(require('crypto').createHash('sha256').update(process.env.SITE_ACCESS_PASSWORD).digest('hex'))")
          fi
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
