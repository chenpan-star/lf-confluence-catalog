name: Deploy remind-track Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Validate GitHub secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REMIND_API_SECRET: ${{ secrets.REMIND_API_SECRET }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID REMIND_API_SECRET ATLASSIAN_EMAIL ATLASSIAN_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name — run scripts/setup-remind-worker-github.sh"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "ATLASSIAN_EMAIL length: ${#ATLASSIAN_EMAIL}"
            echo "ATLASSIAN_API_TOKEN length: ${#ATLASSIAN_API_TOKEN}"
          fi
          exit $missing

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker (initial)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy --config worker/remind-track/wrangler.jsonc 2>&1 | tee deploy.log
          URL="$(grep -oE 'https://[a-zA-Z0-9._-]+\.[a-zA-Z0-9._-]+\.workers\.dev' deploy.log | tail -1 || true)"
          if [ -z "$URL" ]; then
            echo "::warning::Could not parse workers.dev URL from deploy log — check Cloudflare dashboard"
          else
            echo "worker_url=$URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REMIND_API_SECRET: ${{ secrets.REMIND_API_SECRET }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
        run: |
          set -euo pipefail
          put() {
            local key="$1"
            local val="$2"
            if [ -z "$val" ]; then
              echo "::error::Empty Worker secret value for $key"
              exit 1
            fi
            printf '%s' "$val" | npx wrangler secret put "$key" --config worker/remind-track/wrangler.jsonc
          }
          put REMIND_API_SECRET "$REMIND_API_SECRET"
          put ATLASSIAN_EMAIL "$ATLASSIAN_EMAIL"
          put ATLASSIAN_API_TOKEN "$ATLASSIAN_API_TOKEN"
          echo "Worker secrets registered:"
          npx wrangler secret list --config worker/remind-track/wrangler.jsonc

      - name: Redeploy Worker (apply secrets)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config worker/remind-track/wrangler.jsonc

      - name: Health check
        if: steps.deploy.outputs.worker_url != ''
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -e
          ok=0
          for i in 1 2 3 4 5; do
            curl -sf "$WORKER_URL/health" | tee health.json
            if node -e "const h=require('./health.json'); process.exit(h.jiraConfigured?0:1)"; then
              ok=1
              break
            fi
            echo "jiraConfigured still false (attempt $i/5), waiting…"
            sleep 3
          done
          if [ "$ok" -ne 1 ]; then
            echo "::warning::jiraConfigured is false — Worker is up but Jira creds may not be bound. Re-run this workflow or sync secrets locally with wrangler."
            cat health.json
            exit 0
          fi

      - name: Job summary
        if: always()
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          {
            echo "## Remind-track Worker"
            if [ -n "$WORKER_URL" ]; then
              echo "- **Worker URL:** \`$WORKER_URL\`"
              echo "- Health: \`$WORKER_URL/health\` (expect \`jiraConfigured: true\`)"
              echo ""
              echo "### Catalog (step 4)"
              echo "Set repository **variable** \`VITE_REMIND_TRACK_URL\` to the Worker URL above, then redeploy GitHub Pages."
              echo "\`VITE_REMIND_API_KEY\` should already match \`REMIND_API_SECRET\` (setup script)."
            else
              echo "Deploy finished — open Cloudflare Workers dashboard for the script URL."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
