name: Refresh Confluence catalog

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: confluence-catalog
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Verify secrets are configured
        run: |
          if [ -z "${{ secrets.ATLASSIAN_API_TOKEN }}" ]; then
            echo "::error::Missing repository secret ATLASSIAN_API_TOKEN"
            exit 1
          fi
          if [ -z "${{ secrets.ATLASSIAN_EMAIL }}" ]; then
            echo "::error::Missing repository secret ATLASSIAN_EMAIL"
            exit 1
          fi
          echo "Secrets OK."

      - name: Install dependencies
        run: npm ci

      - name: Fetch from Confluence and rebuild catalog
        env:
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          ATLASSIAN_SITE: lotusflare.atlassian.net
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ACCOUNTS_URL: https://accounts.zoho.com
          ZOHO_PEOPLE_URL: https://people.zoho.com
        run: npm run refresh

      - name: Build site with fresh catalog
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit updated catalog to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/catalog.json
          if git diff --staged --quiet; then
            echo "No catalog file changes to commit."
          else
            git commit -m "chore: refresh Confluence catalog"
            git push
          fi
