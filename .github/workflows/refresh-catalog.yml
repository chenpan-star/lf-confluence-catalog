name: Refresh Confluence catalog

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: confluence-catalog
  cancel-in-progress: false

jobs:
  # Confluence fetch uses repository secrets only (no github-pages environment).
  # Environment secrets on github-pages can override repo secrets and cause 403.
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Verify secrets are configured
        env:
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
        run: |
          if [ -z "$ATLASSIAN_API_TOKEN" ]; then
            echo "::error::Missing repository secret ATLASSIAN_API_TOKEN"
            exit 1
          fi
          if [ -z "$ATLASSIAN_EMAIL" ]; then
            echo "::error::Missing repository secret ATLASSIAN_EMAIL"
            exit 1
          fi
          echo "Secrets OK."
          echo "Email length: ${#ATLASSIAN_EMAIL}"
          echo "Email domain: ${ATLASSIAN_EMAIL#*@}"
          echo "Token length: ${#ATLASSIAN_API_TOKEN}"
          echo "(Expected: domain lotusflare.com, email length 23, token length ~24)"

      - name: Install dependencies
        run: npm ci

      - name: Test Confluence API access
        env:
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          ATLASSIAN_SITE: lotusflare.atlassian.net
        run: npm run test:auth

      - name: Fetch from Confluence and rebuild catalog
        env:
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          ATLASSIAN_SITE: lotusflare.atlassian.net
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ACCOUNTS_URL: https://accounts.zoho.com
          ZOHO_PEOPLE_URL: https://people.zoho.com
        run: npm run refresh

      - name: Commit updated catalog to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/catalog.json
          if git diff --staged --quiet; then
            echo "No catalog file changes to commit."
          else
            git commit -m "chore: refresh Confluence catalog"
            git push
          fi
