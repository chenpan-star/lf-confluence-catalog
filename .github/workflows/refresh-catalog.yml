name: Refresh Confluence catalog

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Verify secrets are configured
        run: |
          if [ -z "${{ secrets.ATLASSIAN_API_TOKEN }}" ]; then
            echo "::error::Missing repository secret ATLASSIAN_API_TOKEN"
            echo "Add it at: Settings → Secrets and variables → Actions"
            exit 1
          fi
          if [ -z "${{ secrets.ATLASSIAN_EMAIL }}" ]; then
            echo "::error::Missing repository secret ATLASSIAN_EMAIL"
            exit 1
          fi
          echo "Secrets present (values not shown)."

      - name: Install dependencies
        run: npm ci

      - name: Fetch from Confluence and rebuild catalog
        env:
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          ATLASSIAN_SITE: lotusflare.atlassian.net
        run: npm run refresh

      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/catalog.json
          if git diff --staged --quiet; then
            echo "No catalog changes — Confluence data unchanged since last refresh."
          else
            git commit -m "chore: refresh Confluence catalog"
            git push
          fi
